<div>
    <input type="text" 
        name="busca" 
        placeholder="Buscar..."
        hx-get="/lista"
        hx-trigger="input changed delay:500ms"
        hx-select="#lista"
        hx-target="#lista"
        hx-indicator="#indicator">

    <span id="indicator" class="htmx-indicator">Carregando...</span>
</div>
<div id="lista">
    <ul>
        {% for aluno in alunos %}
            <li>{{ aluno.id }} {{ aluno.nome }}</li>
        {% else %}
            <li>Não há alunos</li>
        {% endfor %}
    </ul>

    <button 
        hx-get="/lista?pagina={{ pagina - 1 }}"
        hx-select="#lista"
        hx-target="#lista"
        {% if pagina == 0 %} disabled {% endif %}>
        Anterior
    </button>

    <button 
        hx-get="/lista?pagina={{ pagina + 1 }}"
        hx-select="#lista"
        hx-target="#lista"
        {% if pagina == ultima_pagina %} disabled {% endif %}>
        Próximo
    </button>
</div>
